<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign in — AI Office Node</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<script src="js/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-sidebar vh-100 d-flex align-items-center justify-content-center position-relative overflow-hidden">
  <div class="auth-grid"></div>

  <button type="button" onclick="toggleTheme()" class="theme-toggle position-absolute top-0 end-0 m-3" title="Toggle light/dark theme">
    <span class="material-symbols-outlined" data-theme-icon>dark_mode</span>
  </button>

  <div class="position-relative w-100 w-max-sm mx-4">
    <div class="d-flex align-items-center gap-3 justify-content-center mb-5">
      <div class="icon-box bg-brand">
        <span class="material-symbols-outlined text-on-brand">hub</span>
      </div>
      <div>
        <h1 class="font-headline-md text-headline-md text-brand mb-0 lh-1">AI Office Node</h1>
        <p class="font-mono-sm text-mono-sm text-secondary mt-1 mb-0">TRA · Local Network Hub</p>
      </div>
    </div>

    <div class="bg-surface border border-soft rounded-xl p-7 shadow-sm">
      <h2 class="font-headline-md text-headline-md text-main mb-1">Sign in</h2>
      <p class="font-body-sm text-body-sm text-secondary mb-4">Use your office credentials to access the node.</p>

      <div id="login-error" hidden class="mb-3 bg-error-container border border-error text-on-error-container font-body-sm text-body-sm rounded px-3 py-2 d-flex align-items-center gap-2">
        <span class="material-symbols-outlined icon-xs">error</span>
        <span id="login-error-text">Invalid username or password.</span>
      </div>

      <form id="login-form" class="d-flex flex-column gap-3">
        <div>
          <label class="font-label-md text-label-md text-on-surface-variant d-block mb-1" for="login-username">USERNAME</label>
          <input id="login-username" type="text" required autocomplete="username"
            class="form-control py-25 font-body-md text-body-md" placeholder="e.g. j.mushi"/>
        </div>
        <div>
          <label class="font-label-md text-label-md text-on-surface-variant d-block mb-1" for="login-password">PASSWORD</label>
          <input id="login-password" type="password" required autocomplete="current-password"
            class="form-control py-25 font-body-md text-body-md" placeholder="••••••••"/>
        </div>
        <button type="submit" class="btn btn-brand w-100 mt-2">SIGN IN</button>
      </form>

      <div class="mt-4 pt-4 border-top border-soft text-center">
        <span class="font-body-sm text-body-sm text-secondary">No account yet? </span>
        <a href="register.html" class="font-body-sm text-body-sm text-primary fw-semibold hover-underline">Request access</a>
      </div>
    </div>

    <p class="text-center font-mono-sm text-mono-sm text-secondary mt-4 mb-0">Demo logins — admin: <span class="text-soft-on-sidebar">admin / admin123</span> · staff: <span class="text-soft-on-sidebar">demo / demo123</span></p>
  </div>

  <script src="js/store.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
