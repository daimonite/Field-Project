<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin — AI Office Node</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="js/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-background text-on-surface h-screen overflow-hidden font-body-md text-body-md">

  <div id="sidebar-root"></div>
  <div id="header-root"></div>

  <div class="ml-64 flex flex-col h-screen relative">
    <main class="flex-1 mt-16 overflow-y-auto p-gutter">
      <div class="max-w-5xl mx-auto">
        <h2 class="font-headline-md text-headline-md text-slate-900 mb-1">Admin</h2>
        <p class="font-body-sm text-body-sm text-secondary mb-6">User approvals, access, and node settings.</p>

        <div class="bg-white border border-outline-variant rounded-lg mb-8">
          <div class="px-5 py-4 border-b border-outline-variant flex items-center justify-between">
            <p class="font-body-md text-body-md font-semibold text-slate-900">Users</p>
            <span id="pending-count" class="font-label-md text-label-md bg-primary-container/30 text-on-primary-container px-2.5 py-1 rounded-full">0 pending</span>
          </div>
          <table class="w-full">
            <thead>
              <tr class="bg-slate-900 text-white">
                <th class="text-left font-label-md text-label-md px-5 py-3">NAME</th>
                <th class="text-left font-label-md text-label-md px-5 py-3">USERNAME</th>
                <th class="text-left font-label-md text-label-md px-5 py-3">DEPARTMENT</th>
                <th class="text-left font-label-md text-label-md px-5 py-3">ROLE</th>
                <th class="text-left font-label-md text-label-md px-5 py-3">STATUS</th>
                <th class="text-right font-label-md text-label-md px-5 py-3">ACTIONS</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>

        <div class="bg-white border border-outline-variant rounded-lg">
          <div class="px-5 py-4 border-b border-outline-variant">
            <p class="font-body-md text-body-md font-semibold text-slate-900">Network &amp; model settings</p>
          </div>
          <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">NODE ADDRESS</label>
              <input value="http://192.168.1.10:8000" class="w-full border border-outline rounded px-3 py-2.5 font-mono-sm text-mono-sm focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none"/>
            </div>
            <div>
              <label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">ACTIVE MODEL</label>
              <input value="qwen3:8b" class="w-full border border-outline rounded px-3 py-2.5 font-mono-sm text-mono-sm focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none"/>
            </div>
            <div>
              <label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">MAX CONCURRENT USERS</label>
              <input value="5" class="w-full border border-outline rounded px-3 py-2.5 font-mono-sm text-mono-sm focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none"/>
            </div>
            <div>
              <label class="font-label-md text-label-md text-on-surface-variant block mb-1.5">DEFAULT PRINTER</label>
              <input value="Office-HP-LaserJet" class="w-full border border-outline rounded px-3 py-2.5 font-mono-sm text-mono-sm focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none"/>
            </div>
          </div>
          <div class="px-5 pb-5">
            <button class="bg-primary-fixed-dim text-slate-900 font-label-md text-label-md px-4 py-2.5 rounded hover:bg-primary-container transition-colors">SAVE SETTINGS</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
