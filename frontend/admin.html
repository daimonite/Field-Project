<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin — AI Office Node</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<script src="js/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-app text-main vh-100 overflow-hidden font-body-md text-body-md">

  <div id="sidebar-root"></div>
  <div id="header-root"></div>

  <div class="content-area d-flex flex-column vh-100 position-relative">
    <main class="page-panel flex-grow-1 overflow-auto p-4 min-h-0">
      <div class="max-w-5xl mx-auto">
        <h2 class="font-headline-md text-headline-md text-main mb-1">Admin</h2>
        <p class="font-body-sm text-body-sm text-secondary mb-4">User approvals, access, and node settings.</p>

        <div class="bg-surface border border-soft rounded-lg mb-4 overflow-hidden">
          <div class="px-4 py-3 border-bottom border-soft d-flex align-items-center justify-content-between">
            <p class="font-body-md text-body-md fw-semibold text-main mb-0">Users</p>
            <span id="pending-count" class="badge-soft badge-pending">0 pending</span>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th class="text-start">NAME</th>
                  <th class="text-start">USERNAME</th>
                  <th class="text-start">DEPARTMENT</th>
                  <th class="text-start">ROLE</th>
                  <th class="text-start">STATUS</th>
                  <th class="text-end">ACTIONS</th>
                </tr>
              </thead>
              <tbody id="users-table-body"></tbody>
            </table>
          </div>
        </div>

        <div class="bg-surface border border-soft rounded-lg">
          <div class="px-4 py-3 border-bottom border-soft">
            <p class="font-body-md text-body-md fw-semibold text-main mb-0">Network &amp; model settings</p>
          </div>
          <div class="p-4">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="font-label-md text-label-md text-on-surface-variant d-block mb-1" for="node-address">NODE ADDRESS</label>
                <input id="node-address" value="http://192.168.1.10:8000" class="form-control font-mono-sm text-mono-sm"/>
              </div>
              <div class="col-12 col-md-6">
                <label class="font-label-md text-label-md text-on-surface-variant d-block mb-1" for="active-model">ACTIVE MODEL</label>
                <input id="active-model" value="qwen3.5:0.8b" class="form-control font-mono-sm text-mono-sm"/>
              </div>
              <div class="col-12 col-md-6">
                <label class="font-label-md text-label-md text-on-surface-variant d-block mb-1" for="max-users">MAX CONCURRENT USERS</label>
                <input id="max-users" value="5" class="form-control font-mono-sm text-mono-sm"/>
              </div>
              <div class="col-12 col-md-6">
                <label class="font-label-md text-label-md text-on-surface-variant d-block mb-1" for="default-printer">DEFAULT PRINTER</label>
                <input id="default-printer" value="Office-HP-LaserJet" class="form-control font-mono-sm text-mono-sm"/>
              </div>
            </div>
            <button type="button" class="btn btn-brand mt-4">SAVE SETTINGS</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
